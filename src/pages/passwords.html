<!doctype html>
<html><head><meta charset="utf-8"><title>Passwords</title>
<link rel="stylesheet" href="kitsune://assets/themes.css"><link rel="stylesheet" href="kitsune://assets/page.css">
<style>
.wrap { max-width: 1120px; } .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; } .grow { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--bg2); color: var(--fg); padding: 8px 16px; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 600; font-size: 13.5px; transition: transform .15s; } .btn:hover { transform: translateY(-1px); } .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; box-shadow: 0 6px 18px var(--glow); } .btn.sm { padding: 4px 11px; font-size: 12px; } .btn.danger { color: var(--err, #ff7a8a); }
.lock { max-width: 440px; margin: 70px auto; text-align: center; } .lock .logo { width: 84px; height: 84px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 24px; background: var(--bg2); box-shadow: 0 10px 30px var(--glow); font-size: 38px; } .lock input { width: 100%; margin: 6px 0; padding: 12px 14px; font-size: 15px; } .lock .err { color: var(--err, #ff7a8a); min-height: 1.3em; font-size: 13px; }
.meter { height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; margin: 6px 0 2px; } .meter i { display: block; height: 100%; width: 0; transition: width .2s, background .2s; }
.cols { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 18px; align-items: start; } @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.list { max-height: calc(100vh - 230px); overflow: auto; padding: 6px; }
.it { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer; } .it:hover { background: var(--bg3); } .it.sel { background: color-mix(in srgb, var(--accent) 22%, var(--bg2)); }
.av { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; background: var(--bg); } .av img { width: 22px; height: 22px; border-radius: 5px; }
.it .m { flex: 1; min-width: 0; } .it .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .it .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.code { font: 700 15px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; color: var(--accent); text-align: right; } .code small { display: block; font: 500 10px system-ui; color: var(--muted); letter-spacing: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.f { padding: 10px 16px; border-top: 1px solid var(--line); } .f:first-child { border-top: 0; } .f label { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 5px; } .f .r { display: flex; gap: 8px; align-items: center; } .f input[type=text], .f input[type=password], .f textarea { flex: 1; width: 100%; } .f textarea { min-height: 70px; font: inherit; }
.big { font: 800 30px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; color: var(--accent); }
.ring { width: 34px; height: 34px; } .ring circle { fill: none; stroke-width: 3.5; } .ring .bg { stroke: var(--bg3); } .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; } .chip { border: 1px solid var(--line); background: var(--bg2); color: var(--fg); border-radius: 999px; padding: 5px 13px; cursor: pointer; font: inherit; font-size: 13px; } .chip.cur { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.gen { padding: 12px 16px; } .gen .out { font: 600 16px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; padding: 10px 12px; background: var(--bg); border-radius: 10px; margin: 8px 0; }
.opts { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; align-items: center; } .opts label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.empty2 { text-align: center; color: var(--muted); padding: 40px 10px; } .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 20; } .modal .box { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: min(460px, 92vw); }
</style></head>
<body><div class="wrap" id="app"></div><div id="toast"></div>
<script src="kitsune://assets/icons.js"></script><script src="kitsune://assets/sfx.js"></script><script src="kitsune://assets/common.js"></script>
<script>
const $ = s => document.querySelector(s), call = (n, ...a) => kitsune.call('vault.' + n, ...a);
const toast = t => { const e = $('#toast'); e.textContent = t; e.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => e.className = '', 2400); };
const err = e => String(e && e.message || e).replace(/^Error invoking remote method '[^']*': (Error: )?/, '');
const COL = ['', '#ff6b6b', '#ffb84d', '#9be36b', '#4fe39a'], LBL = ['', 'Weak', 'Fair', 'Good', 'Strong'];
let st = {}, S, items = [], sel = null, cur = null, filter = 'all', q = '', codes = {}, tick = null, settingsOpen = false, genOpen = false, showPw = false;
async function boot() { st = await call('status'); if (!st.exists) return lockScreen('create'); if (!st.unlocked) return lockScreen('unlock'); await refresh(); main(); }
function lockScreen(mode) {
  clearInterval(tick); const c = mode === 'create';
  $('#app').innerHTML = `<div class="lock"><div class="logo">🔐</div><h1 style="justify-content:center">${c ? 'Create your vault' : 'Passwords are locked'}</h1><p class="lead">${c ? 'Choose a master password. It encrypts everything on this computer and <b>can’t be recovered</b> if you forget it.' : 'Enter your master password to unlock.'}</p>
  <input type="password" id="pw" placeholder="${c ? 'Master password (10+ characters)' : 'Master password'}" autofocus>${c ? '<div class="meter"><i id="mt"></i></div><input type="password" id="pw2" placeholder="Repeat master password">' : ''}<div class="err" id="er"></div><button class="btn primary" id="go" style="width:100%;padding:12px">${c ? 'Create vault' : 'Unlock'}</button>
  ${c ? '<p class="d" style="color:var(--muted);font-size:12.5px;margin-top:14px">Stored encrypted (AES-256-GCM, scrypt key). Kitsune autofills only after you click a suggestion, and never fills hidden fields or other sites’ frames.</p>' : ''}</div>`;
  const go = async () => { const pw = $('#pw').value; $('#er').textContent = ''; try { if (c) { if (pw !== $('#pw2').value) throw new Error('The two passwords don’t match.'); await call('create', pw); } else await call('unlock', pw); await boot(); } catch (e) { $('#er').textContent = err(e); } };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') (c ? $('#pw2') : { focus: go }).focus(); }; if (c) { $('#pw2').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pw').oninput = async () => { const s = await call('strength', $('#pw').value); $('#mt').style.width = s * 25 + '%'; $('#mt').style.background = COL[s]; }; } else $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function refresh() { items = await call('list'); codes = await call('totps'); }
function vis() {
  let l = items; if (filter === 'fav') l = l.filter(x => x.fav); else if (filter === 'weak') l = l.filter(x => x.hasPass && x.strength <= 2); else if (filter === 'reused') l = l.filter(x => x.reused); else if (filter === 'codes') l = l.filter(x => x.hasTotp);
  if (q) { const n = q.toLowerCase(); l = l.filter(x => (x.title + ' ' + x.url + ' ' + x.user).toLowerCase().includes(n)); }
  return l.sort((a, b) => (b.fav - a.fav) || a.title.localeCompare(b.title));
}
function host(u) { try { return new URL(/^[a-z]+:\/\//i.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, ''); } catch (_) { return ''; } }
function main() {
  const weak = items.filter(x => x.hasPass && x.strength <= 2).length, reused = items.filter(x => x.reused).length;
  $('#app').innerHTML = `<div class="top"><h1 style="margin:0"><span id="lg"></span> Passwords</h1><span class="pill">${items.length} items</span><span class="grow"></span><button class="btn primary" id="add">+ Add</button><button class="btn" id="genb">Generator</button><button class="btn" id="setb">Settings</button><button class="btn" id="lockb">🔒 Lock</button></div>
  <div class="cols"><div><div class="card" style="padding:10px"><input type="text" id="q" placeholder="Search…" value="${K.esc(q)}" style="width:100%;margin-bottom:8px"><div class="chips">${[['all', 'All'], ['fav', '★ Favorites'], ['codes', 'Codes'], ['weak', 'Weak' + (weak ? ' (' + weak + ')' : '')], ['reused', 'Reused' + (reused ? ' (' + reused + ')' : '')]].map(([v, l]) => `<button class="chip ${filter === v ? 'cur' : ''}" data-f="${v}">${l}</button>`).join('')}</div></div>
  <div class="card list" id="list" style="margin-top:10px"></div></div><div id="detail"></div></div>`;
  $('#lg').innerHTML = I.key; $('#add').onclick = () => { sel = null; cur = { title: '', url: '', user: '', pass: '', notes: '', totpInput: '' }; showPw = true; drawDetail(); };
  $('#genb').onclick = () => { genOpen = !genOpen; settingsOpen = false; drawDetail(); }; $('#setb').onclick = () => { settingsOpen = !settingsOpen; genOpen = false; drawDetail(); }; $('#lockb').onclick = async () => { await call('lock'); boot(); };
  $('#q').oninput = e => { q = e.target.value; drawList(); }; document.querySelector('.chips').onclick = e => { const b = e.target.closest('button'); if (b) { filter = b.dataset.f; main(); } };
  drawList(); drawDetail(); clearInterval(tick); tick = setInterval(updCodes, 1000);
}
function ringSvg(left, period) { const r = 14, c = 2 * Math.PI * r; return `<svg class="ring" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="${r}"/><circle class="fg" cx="18" cy="18" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - left / period)}" transform="rotate(-90 18 18)"/></svg>`; }
const fmtCode = c => c ? c.code.replace(/(\d{3})(\d+)/, '$1 $2') : '';
function drawList() {
  const l = vis(); const pl = document.querySelector('.top .pill'); if (pl) pl.textContent = items.length + ' items'; $('#list').innerHTML = l.map(x => `<div class="it ${sel === x.id ? 'sel' : ''}" data-id="${x.id}"><div class="av">${host(x.url) ? `<img src="${K.favicon(x.url)}" onerror="this.outerHTML='${K.esc((x.title[0] || '?').toUpperCase())}'">` : K.esc((x.title[0] || '?').toUpperCase())}</div><div class="m"><div class="t">${x.fav ? '★ ' : ''}${K.esc(x.title)}</div><div class="s">${x.hasPass ? `<span class="dot" style="background:${COL[x.strength]}" title="${LBL[x.strength]}"></span>` : ''}${K.esc(x.user || host(x.url) || '')}${x.reused ? ' · reused' : ''}</div></div>${x.hasTotp ? `<div class="code" data-c="${x.id}">${fmtCode(codes[x.id])}<small>${codes[x.id] ? codes[x.id].left + 's' : ''}</small></div>` : ''}</div>`).join('') || `<div class="empty2">${items.length ? 'No matches.' : 'No passwords yet.<br>Sign in to a site and Kitsune will offer to save it, or add one with “+ Add”, or import a CSV.'}</div>`;
  $('#list').onclick = async e => { const it = e.target.closest('.it'); if (!it) return; sel = it.dataset.id; cur = await call('get', sel); cur.totpInput = undefined; showPw = false; genOpen = settingsOpen = false; drawList(); drawDetail(); };
}
async function updCodes() { if (!st.unlocked) return; codes = await call('totps').catch(() => ({})); document.querySelectorAll('[data-c]').forEach(el => { const c = codes[el.dataset.c]; if (c) el.innerHTML = fmtCode(c) + `<small>${c.left}s</small>`; }); const d = $('#dcode'); if (d && sel && codes[sel]) { const c = codes[sel]; d.innerHTML = `<div class="r"><div class="big">${fmtCode(c)}</div>${ringSvg(c.left, c.period)}<button class="btn sm" id="ccode">Copy</button></div>`; $('#ccode').onclick = () => call('copy', sel, 'code').then(() => toast('Code copied (clears in 30 s)')); } }
async function drawDetail() {
  const d = $('#detail');
  if (settingsOpen) return drawSettings(d); if (genOpen) return drawGen(d);
  if (!cur) { d.innerHTML = '<div class="card"><div class="empty2">Select an item, or press “+ Add”.<br><br>Verification codes (2FA) show up live in the list for any item that has a setup key.</div></div>'; return; }
  const isNew = !sel; const st0 = cur.pass ? await call('strength', cur.pass) : 0;
  d.innerHTML = `<div class="card"><div class="f"><label>Title</label><div class="r"><input type="text" id="t" value="${K.esc(cur.title)}" placeholder="e.g. GitHub"><button class="btn sm" id="fav">${cur.fav ? '★' : '☆'}</button></div></div>
  <div class="f"><label>Website</label><div class="r"><input type="text" id="u" value="${K.esc(cur.url)}" placeholder="https://example.com"></div></div>
  <div class="f"><label>Username</label><div class="r"><input type="text" id="us" value="${K.esc(cur.user)}" autocomplete="off"><button class="btn sm" id="cu">Copy</button></div></div>
  <div class="f"><label>Password</label><div class="r"><input type="${showPw ? 'text' : 'password'}" id="p" value="${K.esc(cur.pass)}" autocomplete="new-password"><button class="btn sm" id="sp">${showPw ? 'Hide' : 'Show'}</button><button class="btn sm" id="cp">Copy</button><button class="btn sm" id="gp">Generate</button></div><div class="meter"><i id="pm" style="width:${st0 * 25}%;background:${COL[st0]}"></i></div><div class="d" id="pl" style="font-size:12px;color:var(--muted)">${LBL[st0]}</div></div>
  <div class="f"><label>Verification code (2FA)</label>${cur.totp && cur.totpInput === undefined ? `<div id="dcode"></div><div class="r" style="margin-top:6px"><span class="d" style="font-size:12px;color:var(--muted);flex:1">${K.esc(cur.totp.issuer || 'Authenticator')} · ${cur.totp.digits} digits · ${cur.totp.period}s</span><button class="btn sm" id="rt">Replace key</button><button class="btn sm danger" id="dt">Remove</button></div>` : `<div class="r"><input type="text" id="tk" placeholder="Paste the setup key or otpauth:// link from the site" value="${K.esc(cur.totpInput || '')}"></div><div class="d" id="tkm" style="font-size:12px;color:var(--muted);margin-top:4px">On the site’s 2FA setup page choose “can’t scan the QR code?” and copy the key.</div>`}</div>
  <div class="f"><label>Notes</label><div class="r"><textarea id="n">${K.esc(cur.notes || '')}</textarea></div></div>
  ${cur.history && cur.history.length ? `<div class="f"><label>Previous passwords</label>${cur.history.map(h => `<div class="d" style="font-size:12px;color:var(--muted)">${new Date(h.t).toLocaleDateString()} — <span class="hp" data-p="${K.esc(h.pass)}" style="cursor:pointer">click to copy</span></div>`).join('')}</div>` : ''}
  <div class="f r" style="justify-content:flex-end"><button class="btn danger" id="del" ${isNew ? 'hidden' : ''}>Delete</button><button class="btn primary" id="save">${isNew ? 'Add' : 'Save'}</button></div></div>`;
  const rd = () => { cur.title = $('#t').value; cur.url = $('#u').value; cur.user = $('#us').value; cur.pass = $('#p').value; cur.notes = $('#n').value; if ($('#tk')) cur.totpInput = $('#tk').value.trim(); };
  $('#p').oninput = async () => { const s = await call('strength', $('#p').value); $('#pm').style.width = s * 25 + '%'; $('#pm').style.background = COL[s]; $('#pl').textContent = LBL[s]; };
  $('#fav').onclick = () => { rd(); cur.fav = !cur.fav; drawDetail(); }; $('#sp').onclick = () => { rd(); showPw = !showPw; drawDetail(); };
  $('#gp').onclick = async () => { rd(); cur.pass = await call('generate', { length: 20 }); showPw = true; drawDetail(); };
  $('#cu').onclick = () => { navigator.clipboard.writeText($('#us').value); toast('Username copied'); }; $('#cp').onclick = () => { if (sel) call('copy', sel, 'pass').then(() => toast('Password copied (clears in 30 s)')); else { navigator.clipboard.writeText($('#p').value); toast('Copied'); } };
  const rt = $('#rt'); if (rt) rt.onclick = () => { rd(); cur.totpInput = ''; drawDetail(); }; const dt = $('#dt'); if (dt) dt.onclick = () => { rd(); cur.totp = null; cur.totpInput = ''; cur.removeTotp = true; drawDetail(); };
  const tk = $('#tk'); if (tk) tk.oninput = async () => { const r = tk.value.trim() ? await call('parseTotp', tk.value) : null; $('#tkm').textContent = !r ? 'On the site’s 2FA setup page choose “can’t scan the QR code?” and copy the key.' : r.ok ? '✓ Valid key' + (r.issuer ? ' for ' + r.issuer : '') : (r.error || 'That isn’t a valid setup key.'); };
  document.querySelectorAll('.hp').forEach(h => h.onclick = () => { navigator.clipboard.writeText(h.dataset.p); toast('Copied'); });
  $('#save').onclick = async () => { rd(); try { const o = { id: sel || undefined, title: cur.title, url: cur.url, user: cur.user, pass: cur.pass, notes: cur.notes, fav: !!cur.fav }; if (cur.totpInput !== undefined && cur.totpInput !== '') o.totpInput = cur.totpInput; else if (cur.removeTotp) o.totpInput = ''; const r = await call('save', o); sel = r.id; await refresh(); cur = await call('get', sel); cur.totpInput = undefined; drawList(); drawDetail(); toast('Saved'); } catch (e) { toast(err(e)); } };
  $('#del').onclick = async () => { if (confirm('Delete this item?')) { await call('remove', sel); sel = null; cur = null; await refresh(); drawList(); drawDetail(); } };
  updCodes();
}
let G = { length: 20, upper: true, lower: true, digits: true, symbols: true, noAmbiguous: false }, gout = '';
async function drawGen(d) {
  gout = await call('generate', G); const s = await call('strength', gout);
  d.innerHTML = `<div class="card gen"><h2 style="margin-top:0">Password generator</h2><div class="out" id="go">${K.esc(gout)}</div><div class="meter"><i style="width:${s * 25}%;background:${COL[s]}"></i></div>
  <div class="opts" style="margin:10px 0"><label>Length <input type="range" min="8" max="64" value="${G.length}" id="gl"> <b id="gv">${G.length}</b></label></div><div class="opts">${['upper:ABC', 'lower:abc', 'digits:123', 'symbols:#$%', 'noAmbiguous:No look-alikes'].map(x => { const [k, l] = x.split(':'); return `<label><input type="checkbox" data-g="${k}" ${G[k] ? 'checked' : ''}> ${l}</label>`; }).join('')}</div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="again">Regenerate</button><button class="btn primary" id="gc">Copy</button>${sel || cur ? '<button class="btn" id="use">Use for this item</button>' : ''}</div></div>`;
  $('#gl').oninput = e => { G.length = +e.target.value; $('#gv').textContent = G.length; }; $('#gl').onchange = () => drawGen(d); document.querySelectorAll('[data-g]').forEach(c => c.onchange = () => { G[c.dataset.g] = c.checked; drawGen(d); });
  $('#again').onclick = () => drawGen(d); $('#gc').onclick = () => { navigator.clipboard.writeText(gout); toast('Copied'); }; const u = $('#use'); if (u) u.onclick = () => { cur.pass = gout; showPw = true; genOpen = false; drawDetail(); };
}
async function drawSettings(d) {
  d.innerHTML = `<div class="card"><div class="f"><label>Security</label><div class="r"><span class="grow">Auto-lock after</span><select id="al">${[[0, 'Never'], [5, '5 minutes'], [15, '15 minutes'], [30, '30 minutes'], [60, '1 hour']].map(([v, l]) => `<option value="${v}" ${S.vaultAutoLock === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
  <div class="f"><div class="r"><span class="grow">Offer to save passwords when I sign in</span><div class="tg ${S.vaultOffer ? 'on' : ''}" id="off"></div></div></div>
  <div class="f"><label>Master password</label><div class="r"><input type="password" id="mo" placeholder="Current"><input type="password" id="mn" placeholder="New (10+ characters)"><button class="btn" id="mc">Change</button></div></div>
  <div class="f"><label>Move your passwords</label><div class="r"><input type="file" id="file" accept=".csv,text/csv" hidden><button class="btn" id="imp">Import CSV…</button><button class="btn" id="exp">Export CSV…</button></div><div class="d" style="font-size:12px;color:var(--muted);margin-top:6px">Import works with exports from Chrome, Edge, Brave, Firefox, Bitwarden and 1Password. Exported files are <b>not encrypted</b>; delete them after use.</div></div>
  <div class="f"><div class="d" style="font-size:12.5px;color:var(--muted)">Your vault is stored only on this computer (not synced). Keep your master password safe: there is no recovery.</div></div></div>`;
  $('#al').onchange = e => kitsune.call('settings.set', { vaultAutoLock: +e.target.value }); $('#off').onclick = () => kitsune.call('settings.set', { vaultOffer: !S.vaultOffer });
  $('#mc').onclick = async () => { try { await call('changeMaster', $('#mo').value, $('#mn').value); toast('Master password changed'); $('#mo').value = $('#mn').value = ''; } catch (e) { toast(err(e)); } };
  $('#imp').onclick = () => $('#file').click(); $('#file').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const r = await call('importCsv', await f.text()); await refresh(); toast(`Imported ${r.added} (${r.duplicates} duplicates, ${r.skipped} skipped)`); main(); } catch (er) { toast(err(er)); } };
  $('#exp').onclick = async () => { const pw = prompt('Enter your master password to export:'); if (!pw) return; try { const text = await call('exportCsv', pw); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = 'kitsune-passwords.csv'; a.click(); } catch (er) { toast(err(er)); } };
}
(async () => { const s0 = await K.init(); S = s0.settings; document.addEventListener('k:settings', e => { S = e.detail; if (settingsOpen) drawDetail(); }); kitsune.on('vault', v => { const was = st.unlocked; st = v; if (was && !v.unlocked) boot(); }); boot(); })();
</script></body></html>
