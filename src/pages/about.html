<!doctype html>
<html><head><meta charset="utf-8"><title>About Kitsune</title>
<link rel="stylesheet" href="kitsune://assets/themes.css"><link rel="stylesheet" href="kitsune://assets/page.css">
<style>.big { text-align: center; padding: 30px 0 10px; } .big svg { width: 120px; height: 120px; animation: bob 3.4s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } } .big h1 { justify-content: center; font-size: 38px; } kv { display: contents; }</style></head>
<body><div class="wrap"><div class="big"><div id="logo"></div><h1>Kitsune <span class="pill" id="ed"></span></h1><p class="lead" id="v"></p></div>
<div class="card" id="rows"></div></div>
<script src="kitsune://assets/icons.js"></script><script src="kitsune://assets/common.js"></script>
<script>
(async () => { await K.init(); const i = await kitsune.call('app.info'); document.getElementById('logo').innerHTML = I.fox.replace('width="28" height="28"', 'width="120" height="120"');
document.getElementById('ed').textContent = i.edition === 'lite' ? 'Lite' : 'Full'; document.getElementById('v').textContent = 'Version ' + i.version + ' · light, animated, anime-themed';
const r = [['Chromium', i.chromium], ['Electron', i.electron], ['Platform', i.platform], ['Open tabs', `${i.stats.tabs} (${i.stats.sleeping} sleeping) in ${i.stats.windows} window(s)`], ['Tracker blocklist', i.blocklist + ' hosts'], ['Profile folder', i.userData]];
document.getElementById('rows').innerHTML = r.map(x => `<div class="row"><div class="grow t">${x[0]}</div><div class="d" style="max-width:60%;text-align:right;word-break:break-all">${K.esc(x[1])}</div></div>`).join(''); })();
</script></body></html>
