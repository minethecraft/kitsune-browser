<!doctype html>
<html><head><meta charset="utf-8"><title>Downloads</title>
<link rel="stylesheet" href="kitsune://assets/themes.css"><link rel="stylesheet" href="kitsune://assets/page.css"></head>
<body><div class="wrap">
  <h1><span id="logo"></span> Downloads</h1><p class="lead" id="lead">Saved to your Downloads folder.</p>
  <div class="tools"><button class="btn" id="dir">Change folder…</button><button class="btn danger" id="clr">Clear finished</button></div>
  <div id="list"></div><div class="empty" id="empty" hidden>Nothing downloaded yet.</div>
</div>
<script src="kitsune://assets/icons.js"></script><script src="kitsune://assets/sfx.js"></script><script src="kitsune://assets/common.js"></script>
<script>
const $ = s => document.querySelector(s), call = (n, ...a) => kitsune.call(n, ...a);
let items = [];
function render() {
  $('#empty').hidden = items.length > 0;
  $('#list').innerHTML = items.map(d => { const pct = d.total ? Math.round(100 * d.received / d.total) : 0;
    const st = d.state === 'progressing' ? `${K.bytes(d.received)} of ${K.bytes(d.total) || '?'}${d.paused ? ' · paused' : ''}` : d.state === 'completed' ? K.bytes(d.total || d.received) + ' · ' + K.ago(d.started) : d.state === 'cancelled' ? 'Cancelled' : 'Failed';
    return `<div class="row card" style="margin-bottom:8px" data-id="${d.id}"><div class="grow"><div class="t">${K.esc(d.name)}</div>${d.state === 'progressing' ? `<div class="pb"><i style="width:${pct}%"></i></div>` : ''}<div class="d">${st}</div><div class="d" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7">${K.esc(d.url)}</div></div>
    ${d.state === 'completed' ? '<button class="btn" data-a="open">Open</button><button class="btn" data-a="show">Show in folder</button>' : d.state === 'progressing' ? '<button class="btn" data-a="pause">Pause</button><button class="btn danger" data-a="cancel">Cancel</button>' : ''}<button class="x" data-a="remove" title="Remove from list">✕</button></div>`; }).join('');
  $('#list').querySelectorAll('[data-a]').forEach(b => b.onclick = () => call('dl.' + b.dataset.a, +b.closest('.row').dataset.id));
}
(async () => { const st = await K.init(); $('#logo').innerHTML = I.download; items = await call('dl.list'); render(); kitsune.on('downloads', d => { items = d; render(); });
  $('#clr').onclick = () => call('dl.clear'); $('#dir').onclick = async () => { const d = await call('dl.chooseDir'); $('#lead').textContent = 'Saving to ' + d; };
  if (st.settings.downloadDir) $('#lead').textContent = 'Saving to ' + st.settings.downloadDir; })();
</script></body></html>
