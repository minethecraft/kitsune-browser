<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Anime Hub</title>
<link rel="stylesheet" href="kitsune://assets/themes.css">
<link rel="stylesheet" href="kitsune://assets/page.css">
<style>
.wrap { max-width: 1180px; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; } .wrap { position: relative; z-index: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 18px; margin-top: 8px; }
.ac { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 2/3; background: var(--bg2); border: 1px solid var(--line); display: block; text-decoration: none !important; color: #fff; box-shadow: 0 10px 26px rgba(0,0,0,.3); animation: pop .5s cubic-bezier(.2,.9,.3,1.2) both; transition: transform .3s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s; }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.92); } }
.ac img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2,.8,.3,1); display: block; }
.ac:hover { transform: translateY(-8px) rotate(-.6deg) scale(1.03); box-shadow: 0 24px 46px rgba(0,0,0,.5), 0 0 0 3px var(--glow); } .ac:hover img { transform: scale(1.1); }
.ac .ov { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px; background: linear-gradient(transparent, rgba(0,0,0,.9)); }
.ac .ov b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; line-height: 1.25; }
.ac .ov small { color: rgba(255,255,255,.75); font-size: 11.5px; display: flex; gap: 6px; margin-top: 4px; align-items: center; }
.ac .badge { position: absolute; top: 10px; left: 10px; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.ac .badge.w { background: rgba(20,14,28,.7); color: #fff; backdrop-filter: blur(8px); }
.ac .rt { position: absolute; top: 10px; right: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(20,14,28,.7); backdrop-filter: blur(8px); color: #ffd166; font-weight: 700; font-size: 12px; }

.kn { margin: 4px 0 22px; } .kn h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; } .stat { padding: 8px 16px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); } .stat b { display: block; font-size: 20px; color: var(--accent); } .stat small { color: var(--muted); font-size: 11.5px; }
.cw2 { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: thin; } .cwc { flex: none; width: 330px; display: flex; gap: 12px; padding: 10px; border-radius: 16px; background: var(--bg2); border: 1px solid var(--line); color: var(--fg); text-decoration: none !important; transition: transform .2s, box-shadow .2s; } .cwc:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(0,0,0,.35), 0 0 0 3px var(--glow); }
.cwc img { width: 70px; height: 100px; border-radius: 10px; object-fit: cover; background: var(--bg3); flex: none; } .cwc .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; } .cwc b { font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .cwc small { color: var(--muted); font-size: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; margin-top: auto; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2, var(--accent))); border-radius: 3px; } .go { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); }
.hist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; } .hi { padding: 8px 12px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); font-size: 13px; } .hi small { display: block; color: var(--muted); }
.conn { padding: 16px 18px; border-radius: 16px; background: var(--bg2); border: 1px dashed var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; } .conn .grow { flex: 1; min-width: 220px; } .conn button { border: 0; padding: 9px 18px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 700; cursor: pointer; }
.pill2 { display: inline-flex; gap: 6px; align-items: center; padding: 3px 12px; border-radius: 999px; background: var(--bg3); font-size: 12px; color: var(--muted); margin-left: 8px; vertical-align: middle; } .pill2 i { width: 8px; height: 8px; border-radius: 50%; background: #4fe39a; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <h1><span id="logo"></span> Anime Hub</h1>
  <p class="lead" id="lead">Your Kiroku library, pulled from AniList. Click a card to watch.</p>
  <div class="kn" id="kn" hidden></div>
  <div class="tools">
    <input id="s" type="search" placeholder="Filter your library…">
    <div class="seg" id="seg"><button data-f="all" class="cur">All</button><button data-f="watching">Watching</button><button data-f="watched">Watched</button><button data-f="towatch">To watch</button></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Loading your library…</div>
</div>
<script src="kitsune://assets/icons.js"></script>
<script src="kitsune://assets/sfx.js"></script><script src="kitsune://assets/common.js"></script>
<script src="kitsune://assets/particles.js"></script>
<script>
const $ = s => document.querySelector(s), call = (n, ...a) => kitsune.call(n, ...a);
let all = [], f = 'all', q = '', stop = () => {};
function render() {
  const list = all.filter(x => (f === 'all' || x.status === f) && (!q || x.title.toLowerCase().includes(q)));
  $('#empty').hidden = list.length > 0; if (!list.length) $('#empty').textContent = all.length ? 'Nothing matches.' : 'No library found. Import one in Settings → Anime & Kiroku.';
  $('#grid').innerHTML = list.map((x, i) => `<a class="ac" href="${K.esc(x.watchUrl)}" title="${K.esc(x.title)}" style="animation-delay:${Math.min(i, 24) * 25}ms"><img loading="lazy" src="${K.esc(x.cover || x.banner || '')}"><span class="badge ${x.status === 'watching' ? '' : 'w'}">${x.status === 'watching' ? 'Watching' : 'Watched'}</span>${x.rating ? `<span class="rt">★ ${x.rating}</span>` : ''}<div class="ov"><b>${K.esc(x.title)}</b><small>${x.score ? 'AniList ' + x.score + '%' : ''}</small></div></a>`).join('');
}
const num = n => n == null ? '' : n, esc = s => K.esc(s);
async function loadKn() {
  const box = $('#kn'); let st; try { st = await call('kn.status'); } catch (_) { return; }
  if (!st.read) { box.hidden = false; box.innerHTML = `<div class="conn"><div class="grow"><b>Connect your Kiroku</b><div style="color:var(--muted);font-size:13px;margin-top:3px">See your live library, resume where you left off and track what you watch on Crunchyroll, HIDIVE, Hulu, Netflix, Adult Swim and Disney+.</div></div><button id="kcn">Connect</button></div>`; $('#kcn').onclick = () => { location.href = 'kitsune://settings/#anime'; }; return; }
  const [w, h, ss] = await Promise.all([call('kn.watching').catch(() => []), call('kn.history').catch(() => []), call('kn.stats').catch(() => null)]);
  const sv = (o, ...k) => { for (const x of k) if (o && o[x] != null) return o[x]; };
  const chips = []; if (ss) { const m = [['Watched', sv(ss, 'watched', 'watchedCount', 'completed')], ['Watching', sv(ss, 'watching', 'watchingCount')], ['To watch', sv(ss, 'towatch', 'toWatch', 'planned')], ['Episodes', sv(ss, 'episodes', 'episodesWatched', 'totalEpisodes')], ['Avg rating', (() => { const r = sv(ss, 'avgRating', 'averageRating', 'avg_rating', 'meanRating'); return r != null ? (+r).toFixed(1) : null; })()]]; for (const [l, v] of m) if (v != null && v !== '') chips.push(`<div class="stat"><b>${esc(v)}</b><small>${l}</small></div>`); }
  const ago = t => { if (!t) return ''; const s = Math.round((Date.now() - t) / 1000); return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
  box.hidden = false; box.innerHTML = `<h2>Kiroku<span class="pill2"><i></i>${esc(st.user || 'connected')}</span></h2>${chips.length ? `<div class="stats">${chips.join('')}</div>` : ''}
  ${w.length ? `<h2>Continue watching</h2><div class="cw2">${w.map(x => { const p = x.progress || {}; return `<a class="cwc" href="${esc(x.resume || '#')}"><img src="${esc(x.cover)}" onerror="this.style.visibility='hidden'" loading="lazy"><div class="m"><b>${esc(x.title)}</b><small>${p.episode != null ? 'Episode ' + p.episode : ''}${p.total || x.episodes ? ' of ' + (p.total || x.episodes) : ''}${p.provider ? ' · ' + esc(p.provider) : ''}${p.at ? ' · ' + ago(p.at) : ''}</small><span class="go">Resume ▶</span>${p.pct != null ? `<div class="bar"><i style="width:${Math.max(2, Math.min(100, p.pct))}%"></i></div>` : ''}</div></a>`; }).join('')}</div>` : ''}
  ${h.length ? `<h2>Recent activity</h2><div class="hist">${h.slice(0, 9).map(x => `<div class="hi"><b>${esc(x.title)}</b><small>${x.progress && x.progress.episode != null ? 'Episode ' + x.progress.episode : esc(x.status || '')}${x.at ? ' · ' + ago(x.at) : ''}</small></div>`).join('')}</div>` : ''}`;
}
(async () => {
  await K.init(); $('#logo').innerHTML = I.fox; loadKn();
  stop = Particles.start($('#fx'), K.particleType(), { density: .6 });
  document.addEventListener('k:applied', () => { stop(); stop = Particles.start($('#fx'), K.particleType(), { density: .6 }); });
  $('#empty').hidden = false;
  try { all = await call('kiroku.hub'); } catch (e) { all = []; }
  const lead = () => { $('#lead').textContent = `${all.filter(x => x.status === 'watching').length} watching · ${all.filter(x => x.status === 'watched').length} watched${all.some(x => x.status === 'towatch') ? ' · ' + all.filter(x => x.status === 'towatch').length + ' to watch' : ''} — click a card to open it.`; }; lead();
  render();
  $('#s').addEventListener('input', e => { q = e.target.value.toLowerCase(); render(); });
  $('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; f = b.dataset.f; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('cur', x === b)); render(); });
  kitsune.on('kiroku', async () => { all = await call('kiroku.hub'); lead(); render(); });
  kitsune.on('kirokuLive', () => loadKn());
})();
</script>
</body>
</html>
