<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Anime Hub</title>
<link rel="stylesheet" href="kitsune://assets/themes.css">
<link rel="stylesheet" href="kitsune://assets/page.css">
<style>
.wrap { max-width: 1180px; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; } .wrap { position: relative; z-index: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 18px; margin-top: 8px; }
.ac { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 2/3; background: var(--bg2); border: 1px solid var(--line); display: block; text-decoration: none !important; color: #fff; box-shadow: 0 10px 26px rgba(0,0,0,.3); animation: pop .5s cubic-bezier(.2,.9,.3,1.2) both; transition: transform .3s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s; }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.92); } }
.ac img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2,.8,.3,1); display: block; }
.ac:hover { transform: translateY(-8px) rotate(-.6deg) scale(1.03); box-shadow: 0 24px 46px rgba(0,0,0,.5), 0 0 0 3px var(--glow); } .ac:hover img { transform: scale(1.1); }
.ac .ov { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px; background: linear-gradient(transparent, rgba(0,0,0,.9)); }
.ac .ov b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; line-height: 1.25; }
.ac .ov small { color: rgba(255,255,255,.75); font-size: 11.5px; display: flex; gap: 6px; margin-top: 4px; align-items: center; }
.ac .badge { position: absolute; top: 10px; left: 10px; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.ac .badge.w { background: rgba(20,14,28,.7); color: #fff; backdrop-filter: blur(8px); }
.ac .rt { position: absolute; top: 10px; right: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(20,14,28,.7); backdrop-filter: blur(8px); color: #ffd166; font-weight: 700; font-size: 12px; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <h1><span id="logo"></span> Anime Hub</h1>
  <p class="lead" id="lead">Your Kiroku library, pulled from AniList. Click a card to watch.</p>
  <div class="tools">
    <input id="s" type="search" placeholder="Filter your library…">
    <div class="seg" id="seg"><button data-f="all" class="cur">All</button><button data-f="watching">Watching</button><button data-f="watched">Watched</button></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Loading your library…</div>
</div>
<script src="kitsune://assets/icons.js"></script>
<script src="kitsune://assets/sfx.js"></script><script src="kitsune://assets/common.js"></script>
<script src="kitsune://assets/particles.js"></script>
<script>
const $ = s => document.querySelector(s), call = (n, ...a) => kitsune.call(n, ...a);
let all = [], f = 'all', q = '', stop = () => {};
function render() {
  const list = all.filter(x => (f === 'all' || x.status === f) && (!q || x.title.toLowerCase().includes(q)));
  $('#empty').hidden = list.length > 0; if (!list.length) $('#empty').textContent = all.length ? 'Nothing matches.' : 'No library found. Import one in Settings → Anime & Kiroku.';
  $('#grid').innerHTML = list.map((x, i) => `<a class="ac" href="${K.esc(x.watchUrl)}" title="${K.esc(x.title)}" style="animation-delay:${Math.min(i, 24) * 25}ms"><img loading="lazy" src="${K.esc(x.cover || x.banner || '')}"><span class="badge ${x.status === 'watching' ? '' : 'w'}">${x.status === 'watching' ? 'Watching' : 'Watched'}</span>${x.rating ? `<span class="rt">★ ${x.rating}</span>` : ''}<div class="ov"><b>${K.esc(x.title)}</b><small>${x.score ? 'AniList ' + x.score + '%' : ''}</small></div></a>`).join('');
}
(async () => {
  await K.init(); $('#logo').innerHTML = I.fox;
  stop = Particles.start($('#fx'), K.particleType(), { density: .6 });
  document.addEventListener('k:applied', () => { stop(); stop = Particles.start($('#fx'), K.particleType(), { density: .6 }); });
  $('#empty').hidden = false;
  try { all = await call('kiroku.hub'); } catch (e) { all = []; }
  $('#lead').textContent = `${all.filter(x => x.status === 'watching').length} watching · ${all.filter(x => x.status === 'watched').length} watched — click a card to open it on Aniwatch.`;
  render();
  $('#s').addEventListener('input', e => { q = e.target.value.toLowerCase(); render(); });
  $('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; f = b.dataset.f; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('cur', x === b)); render(); });
  kitsune.on('kiroku', async () => { all = await call('kiroku.hub'); render(); });
})();
</script>
</body>
</html>
