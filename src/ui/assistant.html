<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="kitsune://assets/themes.css">
<style>
html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
* { box-sizing: border-box; }
#p { height: 100vh; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--line); color: var(--fg); font: 13.5px/1.5 Inter, system-ui, sans-serif; position: relative; }
#p::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 160px; pointer-events: none; background: linear-gradient(180deg, var(--glow), transparent); opacity: .35; }
header { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
header b { font-weight: 800; font-size: 14px; flex: 1; display: flex; align-items: center; gap: 8px; }
header b i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.6); opacity: .6; } }
.ib { width: 28px; height: 28px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; transition: background .15s, color .15s, transform .15s; }
.ib:hover { background: var(--bg3); color: var(--fg); transform: scale(1.08); }
.bar { position: relative; display: flex; gap: 8px; padding: 0 12px 8px; align-items: center; }
.seg { display: flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 11px; padding: 2px; flex: none; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 9px; cursor: pointer; font: inherit; font-weight: 600; font-size: 12.5px; transition: all .18s; }
.seg button.on { background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 14px -6px var(--accent); }
select { flex: 1; min-width: 0; background: var(--bg2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; font: inherit; font-size: 12px; }
#modeNote { position: relative; padding: 0 12px 6px; font-size: 11.5px; color: var(--muted); }
#log { position: relative; flex: 1; overflow-y: auto; padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.m { max-width: 94%; padding: 8px 11px; border-radius: 14px; word-wrap: break-word; overflow-wrap: anywhere; animation: pop .25s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } }
.m.u { align-self: flex-end; background: linear-gradient(120deg, var(--accent), var(--accent2, var(--accent))); color: var(--accent-fg); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.m.a { align-self: flex-start; background: var(--bg2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.m.a p { margin: 0 0 7px; } .m.a p:last-child { margin: 0; } .m.a ul, .m.a ol { margin: 4px 0 7px; padding-left: 20px; }
.m.a code { background: var(--bg3); padding: 1px 5px; border-radius: 5px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
.m.a pre { background: var(--bg3); padding: 8px 10px; border-radius: 10px; overflow-x: auto; margin: 6px 0; } .m.a pre code { background: none; padding: 0; }
.m.a a { color: var(--accent); }
.m.e { align-self: stretch; background: #ff5d7a22; border: 1px solid #ff5d7a66; border-radius: 12px; }
.note { align-self: center; font-size: 11.5px; color: var(--muted); }
.tool { align-self: flex-start; font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; animation: pop .25s both; }
.tool .d { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); } .tool.run .d { background: var(--accent); animation: pulse 1s infinite; } .tool.done .d { background: #6fe3a1; } .tool.denied .d, .tool.error .d { background: #ff5d7a; }
.ap { align-self: stretch; background: var(--bg2); border: 1px solid var(--accent); border-radius: 14px; padding: 10px 12px; box-shadow: 0 0 0 3px var(--glow); animation: pop .3s cubic-bezier(.2,.9,.3,1.3) both; }
.ap small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
.ap div.s { font-weight: 600; margin-bottom: 8px; word-break: break-word; }
.ap .r { display: flex; gap: 8px; } .ap button { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 7px; font: inherit; font-weight: 700; cursor: pointer; background: var(--bg3); color: var(--fg); transition: transform .15s; } .ap button:hover { transform: translateY(-1px); }
.ap button.y { background: var(--accent); color: var(--accent-fg); border: 0; }
.ap.done { opacity: .55; box-shadow: none; border-color: var(--line); } .ap.done .r { display: none; }
.dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin: 0 1.5px; animation: bounce 1s infinite; } .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 40% { transform: translateY(-4px); opacity: 1; } 0%, 80%, 100% { opacity: .4; } }
#chips { position: relative; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
#chips button { border: 1px solid var(--line); background: var(--bg2); color: var(--fg); border-radius: 99px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; transition: all .15s; } #chips button:hover { border-color: var(--accent); transform: translateY(-1px); }
form { position: relative; display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid var(--line); align-items: flex-end; }
textarea { flex: 1; resize: none; max-height: 120px; min-height: 38px; background: var(--bg2); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font: inherit; outline: none; } textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
#send { width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg); cursor: pointer; font-size: 16px; font-weight: 800; flex: none; transition: transform .15s; } #send:hover { transform: scale(1.08); } #send.stop { background: #ff5d7a; color: #fff; }
#setup { position: relative; padding: 18px 16px; display: none; flex-direction: column; gap: 10px; flex: 1; }
#setup h3 { margin: 0; font-size: 17px; } #setup p { margin: 0; color: var(--muted); }
#setup input { background: var(--bg2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; width: 100%; }
#setup button { border: 0; background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 9px; font: inherit; font-weight: 700; cursor: pointer; }
#serr { color: #ff8da1; min-height: 18px; font-size: 12px; }
.pre { background: var(--bg3); border-radius: 8px; padding: 6px 8px; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<div id="p">
  <header><b><i></i>Nimbus Assistant</b><button class="ib" id="reset" title="New chat">⟲</button><button class="ib" id="close" title="Close (Ctrl/Cmd+Shift+A)">✕</button></header>
  <div id="setup">
    <h3>Connect Nimbus</h3>
    <p>Paste your Nimbus API key to chat with the assistant. It’s stored encrypted on this computer and only sent to your Nimbus server.</p>
    <input id="key" type="password" placeholder="Nimbus API key" autocomplete="off" spellcheck="false">
    <button id="save">Connect</button><div id="serr"></div>
  </div>
  <div id="main" style="display:contents">
    <div class="bar"><div class="seg"><button data-m="assistant">Assistant</button><button data-m="cowork">Co-work</button></div><select id="model" title="Model"></select></div>
    <div id="modeNote"></div>
    <div id="log"></div>
    <div id="chips"></div>
    <form id="f"><textarea id="t" rows="1" placeholder="Ask about this page, your tabs, Kitsune…"></textarea><button id="send" type="submit" title="Send">↑</button></form>
  </div>
</div>
<script src="kitsune://assets/common.js"></script>
<script>
const $ = s => document.querySelector(s), call = (n, ...a) => kitsune.call(n, ...a);
let mode = 'assistant', busy = false, cur = null, curText = '', snap = null;
const NOTES = { assistant: 'Ask about the page you’re viewing, your open tabs, extensions, features — or anything. Read-only: I can’t control the browser.', cowork: 'I can operate the browser for you. <b>You approve every action</b> before it happens.' };
const CHIPS = { assistant: ['Summarize this page', 'What tabs do I have open?', 'What can Kitsune do?', 'What extensions are installed?'], cowork: ['Open AniList and find today’s airing anime', 'Search YouTube for lofi anime mix', 'Scroll down and tell me what’s on this page'] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(src) {
  const blocks = []; src = esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => { blocks.push(c.replace(/\n$/, '')); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  const inl = t => t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
  const out = []; let list = null;
  const flush = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const line of src.split('\n')) {
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
    else { flush(); if (/^#{1,4}\s/.test(line)) out.push('<p><b>' + inl(line.replace(/^#+\s/, '')) + '</b></p>'); else if (line.trim()) out.push('<p>' + inl(line) + '</p>'); }
  }
  flush();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => '<pre><code>' + blocks[i] + '</code></pre>');
}
const log = $('#log'); const scroll = () => { log.scrollTop = log.scrollHeight; };
function add(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; log.appendChild(d); scroll(); return d; }
function setBusy(b) { busy = b; const s = $('#send'); s.textContent = b ? '■' : '↑'; s.classList.toggle('stop', b); s.title = b ? 'Stop' : 'Send'; const dots = log.querySelector('.dots'); if (dots && !b) dots.parentElement.remove(); }
function typing() { if (!log.querySelector('.dots')) add('m a', '<span class="dots"><span></span><span></span><span></span></span>'); }
function setMode(m, fromUser) { mode = m; document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); $('#modeNote').innerHTML = NOTES[m]; renderChips(); }
function renderChips() { const c = $('#chips'); c.innerHTML = log.children.length ? '' : CHIPS[mode].map(x => `<button>${esc(x)}</button>`).join(''); c.querySelectorAll('button').forEach(b => b.onclick = () => send(b.textContent)); }
function send(text) {
  text = (text || '').trim(); if (!text || busy) return;
  add('m u', esc(text)); $('#t').value = ''; autosize(); cur = null; curText = ''; setBusy(true); typing(); renderChips();
  call('ai.send', { text, mode, modelId: $('#model').value || undefined });
}
function autosize() { const t = $('#t'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
$('#f').onsubmit = e => { e.preventDefault(); if (busy) call('ai.stop'); else send($('#t').value); };
$('#t').oninput = autosize;
$('#t').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!busy) send($('#t').value); } };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { setMode(b.dataset.m, true); call('settings.set', { aiMode: b.dataset.m }); });
$('#model').onchange = () => call('settings.set', { nimbusModel: $('#model').value });
$('#close').onclick = () => call('ai.close');
$('#reset').onclick = () => { call('ai.reset'); log.innerHTML = ''; setBusy(false); renderChips(); };

kitsune.on('ai.event', ev => {
  if (ev.type === 'delta') { log.querySelector('.dots')?.parentElement.remove(); if (!cur) cur = add('m a', ''); curText += ev.text; cur.innerHTML = md(curText); scroll(); }
  else if (ev.type === 'turn_break') { cur = null; curText = ''; }
  else if (ev.type === 'tool') { log.querySelector('.dots')?.parentElement.remove(); const old = [...log.querySelectorAll('.tool.run')].pop(); if (old && ev.status !== 'run') old.remove(); add('tool ' + ev.status, `<span class="d"></span>${esc(ev.summary || ev.name)}${ev.error ? ' — ' + esc(ev.error) : ''}${ev.status === 'denied' ? ' (denied)' : ''}`); if (ev.status !== 'denied' && ev.status !== 'error') typing(); }
  else if (ev.type === 'approval') { log.querySelector('.dots')?.parentElement.remove(); cur = null; curText = '';
    const d = add('ap', `<small>Co-work wants to</small><div class="s">${esc(ev.summary)}</div><div class="r"><button class="n">Deny</button><button class="y">Allow</button></div>`);
    const fin = ok => { d.classList.add('done'); d.querySelector('small').textContent = ok ? 'Allowed' : 'Denied'; call('ai.approve', ev.id, ok); if (ok) typing(); };
    d.querySelector('.y').onclick = () => fin(true); d.querySelector('.n').onclick = () => fin(false); }
  else if (ev.type === 'note') add('note', esc(ev.text));
  else if (ev.type === 'error') { setBusy(false); add('m e', esc(ev.message)); if (/key|sign in|unauth|401|403/i.test(ev.message)) showSetup(ev.message); }
  else if (ev.type === 'done') { setBusy(false); cur = null; curText = ''; if (ev.stopped) add('note', 'Stopped.'); renderChips(); }
});
kitsune.on('ai.focus', () => $('#t').focus());

function showSetup(err) { $('#setup').style.display = 'flex'; $('#main').style.display = 'none'; $('#serr').textContent = err || ''; }
async function loadModels(sel) {
  const r = await call('ai.models'); const m = $('#model');
  m.innerHTML = '<option value="">Default model</option>' + (r.models || []).map(x => `<option value="${esc(x.id)}">${esc(x.name)} · ${esc(x.tier || '')}</option>`).join('');
  m.value = sel || '';
}
async function boot() {
  const st = await K.init(); const c = await call('ai.config');
  setMode(c.mode || 'assistant'); renderChips();
  if (!c.hasToken) return showSetup('');
  $('#setup').style.display = 'none'; $('#main').style.display = 'contents'; loadModels(c.model);
}
$('#save').onclick = async () => {
  const v = $('#key').value.trim(); if (!v) return; $('#serr').textContent = 'Checking…';
  const r = await call('ai.setToken', v);
  if (!r.ok) { $('#serr').textContent = r.error || 'That key didn’t work.'; return; }
  $('#key').value = ''; boot();
};
$('#key').onkeydown = e => { if (e.key === 'Enter') $('#save').click(); };
boot();
</script>
</body>
</html>
