name: Build Kitsune

on:
  workflow_dispatch:
  push:
    paths: ['MAC_BUILD']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ed: [full, lite]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set edition
        run: node scripts/set-edition.js ${{ matrix.ed }}

      - name: Mac Full (dmg)
        if: matrix.ed == 'full'
        run: npx electron-builder --mac dmg --arm64 --publish never --config.mac.artifactName='Kitsune-${version}-${arch}.${ext}'

      - name: Mac Lite (dmg)
        if: matrix.ed == 'lite'
        run: npx electron-builder --mac dmg --arm64 --publish never --config.mac.artifactName='Kitsune-Lite-${version}-${arch}.${ext}'

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.ed }}
          if-no-files-found: error
          path: dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - name: Publish dmgs to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "mac-v$V-run${{ github.run_number }}" dmgs/*.dmg --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Mac builds v$V" --notes "Unsigned Apple-silicon builds."
