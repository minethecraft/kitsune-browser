name: Build Kitsune

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        ed: [full, lite]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set edition
        run: node scripts/set-edition.js ${{ matrix.ed }}

      - name: Windows Full (installer)
        if: matrix.os == 'windows-latest' && matrix.ed == 'full'
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never --config.nsis.artifactName='Kitsune-Setup-${version}.${ext}'

      - name: Windows Lite (portable exe)
        if: matrix.os == 'windows-latest' && matrix.ed == 'lite'
        shell: bash
        run: npx electron-builder --win portable --x64 --publish never --config.portable.artifactName='Kitsune-Lite-Portable-${version}.${ext}'

      - name: Mac Full (dmg)
        if: matrix.os == 'macos-latest' && matrix.ed == 'full'
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never --config.mac.artifactName='Kitsune-${version}-${arch}.${ext}'

      - name: Mac Lite (zip)
        if: matrix.os == 'macos-latest' && matrix.ed == 'lite'
        run: npx electron-builder --mac zip --x64 --arm64 --publish never --config.mac.artifactName='Kitsune-Lite-${version}-mac-${arch}.${ext}'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.ed }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
